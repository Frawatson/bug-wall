name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  next-build:
    name: Next.js build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: echo "DATABASE_URL=$DATABASE_URL"
      - run: npm ci
      - run: npm run build

  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: |
          shopt -s nullglob
          files=(scripts/*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Python files found in scripts/, skipping syntax check."
          else
            python -m py_compile "${files[@]}"
          fi

  java-build:
    name: Java tools build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build leaderboard
        working-directory: tools/java/leaderboard
        run: mvn -B -q package -DskipTests
