services:
  postgres:
    image: postgres:16-alpine
    container_name: bugwall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bugwall
      POSTGRES_PASSWORD: bugwall
      POSTGRES_DB: bugwall
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugwall -d bugwall"]
      interval: 5s
      timeout: 5s
      retries: 10
